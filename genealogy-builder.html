<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Genealogy Builder</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f1115;
      color: #fff;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 360px;
      background: #121622;
      overflow-y: auto;
      padding: 10px;
      border-right: 1px solid #222838;
    }

    .card {
      background: #1a1f2b;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      background: #0f1115;
      border: 1px solid #2a3142;
      color: white;
      border-radius: 6px;
    }

    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: #2a3142;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3a435a;
    }

    .person {
      margin-top: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">
  <div class="sidebar" id="sidebar"></div>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>

</body>
</html>
